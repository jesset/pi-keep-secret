<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="pi-keep-secret: transparent egress secret masking for pi coding-agent sessions">
  <!-- Social preview card: dark restrained text card. No external resources. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- top accent hairline -->
  <rect x="96" y="96" width="240" height="6" rx="3" fill="url(#accent)"/>

  <!-- project name -->
  <text x="96" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#f0f6fc">
    pi-keep-secret
  </text>

  <!-- subtitle -->
  <text x="96" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="400" fill="#9198a1">
    Transparent egress secret masking for pi coding-agent sessions
  </text>

  <!-- masking example line -->
  <text x="96" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="44" font-weight="500">
    <tspan fill="#f0883e">sk-•••••</tspan>
    <tspan fill="#9198a1">&#160;&#160;→&#160;&#160;</tspan>
    <tspan fill="#3fb950">sk-A1B2C3D4E5F6</tspan>
  </text>

  <!-- provider view caption -->
  <text x="96" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#6e7681">
    the provider only ever sees the placeholder — your transcript keeps real values
  </text>
</svg>
